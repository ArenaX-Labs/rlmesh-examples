[project]
name = "rlmesh-env-stack-conflict-agent"
version = "0.0.0"
# The agent imports only rlmesh + numpy. It never imports gymnasium/mujoco, so
# it is immune to the version conflict between the two env servers.
requires-python = ">=3.11"
dependencies = ["rlmesh", "numpy", "imageio[ffmpeg]", "tqdm"]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
rlmesh = { path = "../../../rlmesh/python/rlmesh", editable = true }
