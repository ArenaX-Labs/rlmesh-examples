# its pygame==2.1.0 dep forces Python 3.10. These pins cannot coexist with the
# sim-modern venv
requires-python = "==3.10.*"
dependencies = ["safety-gymnasium==1.0.0", "rlmesh==0.1.0rc15", "numpy"]
