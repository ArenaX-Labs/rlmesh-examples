name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.10.2
          install: true
          cache: true

      # ur10e-mujoco renders its wrist camera through Mesa's EGL.
      - name: Install EGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri

      # The pi harness tests run the pinned pi; Node comes from mise.
      - name: Install pi
        run: npm install --prefix python/llm-agent/.venv-pi --save-exact @mariozechner/pi-coding-agent@0.73.1

      - name: Lint
        run: mise run check

      - name: Test
        run: uv run pytest

      - name: Test Docker images
        run: uv run pytest -m docker
