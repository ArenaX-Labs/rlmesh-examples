# This folder pins Python 3.10 (safety-gymnasium's upstream ceiling), overriding
# the repo-wide Python 3.11 from the root mise.toml. mise installs 3.10 and puts
# it on PATH; uv selects it via pyproject.toml's `requires-python` so the project
# venv is built with the right interpreter. Dependencies are managed by
# pyproject.toml + uv.

[tools]
python = "3.10"

[settings]
python.uv_venv_auto = "create|source"
