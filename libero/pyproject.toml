[project]
name = "libero-env"
version = "0.1.0"
requires-python = "~=3.10.0"
dependencies = ["rlmesh==0.1.0rc15", "hf-libero==0.1.4", "torch<2.6", "torchvision"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
